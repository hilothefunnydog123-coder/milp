[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "optionslab"
version = "0.1.0"
description = "Options pricing with three independent engines that cross-validate — Black-Scholes closed form, CRR binomial trees (European & American), Monte Carlo with antithetic variates — plus full Greeks, implied vol, and payoff diagrams"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[project.scripts]
optionslab = "optionslab.cli:main"

[tool.setuptools.packages.find]
include = ["optionslab*"]
